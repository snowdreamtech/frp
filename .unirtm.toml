#:schema ./schemas/unirtm.schema.json


[env]
GOTOOLCHAIN = "auto"
COREPACK_INTEGRITY_KEYS = "0"
PYTHONUTF8 = "1"
PYTHONUNBUFFERED = "1"
UNIRTM_NODE_COMPILE = "{% if env.ALPINE_VERSION is defined %}false{% endif %}"
UNIRTM_NODE_FLAVOR = "{% if env.ALPINE_VERSION is defined %}musl{% endif %}"
UNIRTM_HOOK_ALLOW_MISSING = "1"

[tools]
"github:anchore/syft" = "1.55.0"
"github:aquasecurity/trivy" = "0.76.1"
"github:astral-sh/ruff" = "0.16.6"
"github:cli/cli" = "2.102.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:google/osv-scanner" = "2.7.0"
"github:koalaman/shellcheck" = "0.11.0"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "v3.14.0"
"github:rhysd/actionlint" = "1.7.12"
"github:zizmorcore/zizmor" = "1.31.1"
"github:goreleaser/goreleaser" = "2.18.2"
go = "1.27.3"
node = "26.8.1"
"npm:@commitlint/cli" = "21.2.4"
"npm:@commitlint/config-conventional" = "21.2.4"
"npm:@taplo/cli" = "0.7.0"
"npm:eslint" = "10.13.0"
"npm:prettier" = "3.9.10"
"npm:sort-package-json" = "4.1.0"
"npm:stylelint" = "17.16.0"
"pipx:pip-audit" = "2.10.1"
python = "3.14.7"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"

"go:golang.org/x/tools/cmd/goimports" = "v0.49.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "v2.13.2"
"go:github.com/securego/gosec/v2/cmd/gosec" = "v2.29.0"

[guard]
enabled = true

[tasks]
[tasks.audit]
description = "Run comprehensive security audit sequentially"
depends = [
  "audit:gitleaks",
  "audit:zizmor",
  "audit:osv",
  "audit:npm",
  "audit:pip",
  "audit:govulncheck",
  "audit:trivy",
]
output = "interleaved"

[tasks."audit:fix"]
description = "Auto-fix security flaws and dependency vulnerabilities where supported"
depends = ["audit:zizmor", "audit:npm", "audit:pip"]
output = "interleaved"
env = { UNIRTM_FIX = "1" }

[tasks."audit:gitleaks"]
description = "Scan for hardcoded secrets"
run = '''
# In CI environments, perform a full deep-history scan across all Git commits.
# In local development, scan only the workspace directory to keep feedback instant.
if [ "${CI:-}" = "true" ] || [ "${GITHUB_ACTIONS:-}" = "true" ] || [ "${RUN_GITLEAKS_FULL_HISTORY:-}" = "1" ]; then
    unirtm exec -- gitleaks detect --source . --no-banner
else
    unirtm exec -- gitleaks detect --source . --no-git --no-banner
fi
'''
output = "interleaved"
env = { GIT_CONFIG_COUNT = "1", GIT_CONFIG_KEY_0 = "diff.renameLimit", GIT_CONFIG_VALUE_0 = "0" }

[tasks."audit:zizmor"]
description = "Audit GitHub Actions workflows for security flaws"
run = '''
OFFLINE_FLAG="--offline"
if [ "${CI:-}" = "true" ] || [ "${GITHUB_ACTIONS:-}" = "true" ]; then
    OFFLINE_FLAG=""
fi

if [ "$UNIRTM_FIX" = "1" ]; then
    unirtm exec -- zizmor . --format plain --config .zizmor.yml $OFFLINE_FLAG --fix=all
else
    unirtm exec -- zizmor . --format plain --config .zizmor.yml $OFFLINE_FLAG
fi
'''
output = "interleaved"

[tasks."audit:osv"]
description = "Generic vulnerability scan across lockfiles"
run = '''
# In local development, skip external Google OSV network scan unless explicitly requested.
if [ "${CI:-}" != "true" ] && [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${RUN_OSV_LOCAL:-}" != "1" ]; then
    echo "↷  Skipped osv-scanner online vulnerability scan locally (deferred to CI runner)."
    exit 0
fi

for i in 1 2 3; do
    if unirtm exec -- osv-scanner scan -r . --config .osv-scanner.toml --allow-no-lockfiles --no-call-analysis=go; then
        exit 0
    fi
    echo "⚠️  osv-scanner failed. Retrying ($i/3)..."
    sleep 2
done
exit 1
'''
output = "interleaved"

[tasks."audit:npm"]
description = "Node.js dependency audit"
run = '''
if [ -f "package.json" ]; then
    if [ "$UNIRTM_FIX" = "1" ]; then
        unirtm exec -- npm audit fix --registry=https://registry.npmjs.org
    else
        unirtm exec -- npm audit --registry=https://registry.npmjs.org
    fi
else
    echo "↷  Skipped (no package.json)"
fi
'''
output = "interleaved"

[tasks."audit:pip"]
description = "Python dependency audit"
run = '''
if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
    if [ "$UNIRTM_FIX" = "1" ]; then
        unirtm exec -- pip-audit --fix
    else
        unirtm exec -- pip-audit
    fi
else
    echo "↷  Skipped (no python requirements)"
fi
'''
output = "interleaved"

[tasks."audit:govulncheck"]
description = "Go dependency audit"
run = '''
if [ -f "go.mod" ]; then
    # In local development, skip external Go vulnerability network scan unless explicitly requested.
    if [ "${CI:-}" != "true" ] && [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${RUN_GOVULNCHECK_LOCAL:-}" != "1" ]; then
        echo "↷  Skipped govulncheck online vulnerability scan locally (deferred to CI runner)."
        exit 0
    fi
    unirtm exec -- govulncheck ./...
else
    echo "↷  Skipped (no go.mod)"
fi
'''
output = "interleaved"

[tasks."audit:trivy"]
description = "Generate and scan SBOM using Trivy"
run = '''
# In local development, skip heavy Trivy vulnerability database downloads unless explicitly requested.
if [ "${CI:-}" != "true" ] && [ "${GITHUB_ACTIONS:-}" != "true" ] && [ "${RUN_TRIVY_LOCAL:-}" != "1" ]; then
    echo "↷  Skipped Trivy heavy vulnerability DB scan locally (deferred to CI runner)."
    exit 0
fi

export TRIVY_SKIP_VERSION_CHECK="true"
export TRIVY_DB_REPOSITORY="${TRIVY_DB_REPOSITORY:-ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2}"
export TRIVY_JAVA_DB_REPOSITORY="${TRIVY_JAVA_DB_REPOSITORY:-ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1}"
export TRIVY_CHECKS_BUNDLE_REPOSITORY="${TRIVY_CHECKS_BUNDLE_REPOSITORY:-ghcr.io/aquasecurity/trivy-checks:2,public.ecr.aws/aquasecurity/trivy-checks:2}"

unirtm exec -- trivy fs --format cyclonedx --output sbom.json .

if [ "${CI:-}" = "true" ] || [ "${GITHUB_ACTIONS:-}" = "true" ]; then
    if ! unirtm exec -- trivy sbom sbom.json; then
        echo "⚠️  Trivy online scan failed. Trying offline scan with cached DB..."
        unirtm exec -- trivy sbom --skip-db-update --skip-java-db-update --offline-scan sbom.json
    fi
else
    # Try offline mode first. If missing DB, it will fail and we fallback to multi-source online.
    if ! unirtm exec -- trivy sbom --skip-db-update --skip-java-db-update --offline-scan sbom.json; then
        echo "⚠️  Local Trivy DB missing or outdated. Downloading from multi-source registries..."
        unirtm exec -- trivy sbom sbom.json
    fi
fi
'''
output = "interleaved"

[tasks.fix]
description = "Auto-fix code format, text hygiene, and dependencies in-place"
depends = ["audit:fix"]
run = "unirtm fix --all"
output = "interleaved"

[tasks.lint]
description = "Fast lint: Inspect changed files with Go-native Quality Guard"
run = "unirtm check"
output = "interleaved"

[tasks.lint-all]
description = "Full lint: Audit all repository files with Go-native Quality Guard"
run = "unirtm check --all"
output = "interleaved"

[tasks.test]
description = "Run template sanity check"
run = "unirtm version"
output = "interleaved"
env = { GOTOOLCHAIN = "auto", CGO_ENABLED = "0" }

[tasks.verify]
description = "Run verification sequentially: incremental on local, full-coverage on CI"
run = '''
if [ "${CI:-}" = "true" ] || [ "${GITHUB_ACTIONS:-}" = "true" ]; then
    echo "🔍 CI Environment detected: Running full repository lint..."
    unirtm run lint-all
else
    echo "⚡ Local Environment detected: Running fast incremental lint on changed files..."
    unirtm run lint
fi
unirtm run test
unirtm run audit
'''
output = "interleaved"

[tasks."audit:trivy-update"]
description = "Update Trivy vulnerability databases locally"
run = '''
export TRIVY_DB_REPOSITORY="ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2"
export TRIVY_JAVA_DB_REPOSITORY="ghcr.io/aquasecurity/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1"
export TRIVY_CHECKS_BUNDLE_REPOSITORY="ghcr.io/aquasecurity/trivy-checks:2,public.ecr.aws/aquasecurity/trivy-checks:2"

echo "Downloading main vulnerability DB..."
unirtm exec -- trivy image --download-db-only

echo "Downloading Java index DB..."
unirtm exec -- trivy image --download-java-db-only
'''
output = "interleaved"

[settings]
cache_dir = ""
cache_ttl = 86400
jobs = 0
data_dir = ""
